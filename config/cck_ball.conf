# Set the minimum auto-connect interval to 7.5ms
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6

# 11.25ms connection interval between peripheral and central
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9

# Latency of 0 means the peripheral won't skip any connection events, always staying in an active
# listening state. This solves the issue where the peripheral sleeps too deeply to be woken by the
# central, at the cost of slightly increased peripheral power consumption.
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Connection is only dropped after 4000ms without any communication
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# Enable encoders
CONFIG_EC11=y
# GLOBAL_THREAD uses the system work queue for encoder processing — stable under
# BLE + trackball + ZMK Studio load. OWN_THREAD caused hard faults because its
# 1024-byte stack overflowed when all subsystems were active simultaneously.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# MOUSE
CONFIG_ZMK_POINTING=y

# CONFIG_ZMK_EXT_POWER=y

# Increase keyboard debounce
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Enable keyboard RGB underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_LED_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Settings in this file apply to both halves. The left/right conf files are used when the two halves require different configurations.

# Bluetooth enhancements
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Key remapping (ZMK Studio)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n



